# Deploy from repository root; supply --build-arg NEXT_PUBLIC_PRIVY_APP_ID=YOUR_APP_ID.
# Change both app names/URLs if these globally unique Fly names are unavailable.
app = "enclavo-web"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[env]
  ENCLAVO_GATEWAY_URL = "http://enclavo-gateway.internal:8080"

[deploy]
  strategy = "rolling"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/api/health/ready"
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
