# Enclavo gateway configuration. Copy to enclavo.toml and adjust.
# Secrets never live here: provider keys and the facilitator credential come from environment
# variables named below.

[server]
listen = "0.0.0.0:8080"
public_url = "http://localhost:8080"
max_body_bytes = 10485760
# client_ip_header = "fly-client-ip"   # trusted proxy header for per-IP limits
# metrics_listen = "127.0.0.1:9091"    # serve /metrics on a private port instead
drain_timeout_secs = 280

[database]
url_env = "DATABASE_URL"
max_connections = 20

[pricing]
markup_bps = 0                # margin over route prices, in basis points
default_max_tokens = 4096     # completion budget when a request sets none

[router]
max_attempts = 3
first_byte_timeout_secs = 30
failure_threshold = 3
cooldown_secs = 10
max_cooldown_secs = 300
ewma_alpha = 0.2

[limits]
per_key_rps = 20
per_key_burst = 40
per_ip_rps = 10
per_ip_burst = 20

[batch]
enabled = true
discount_bps = 3000           # 30% off live prices
max_concurrency = 8
live_busy_threshold = 64      # batch work pauses above this many live requests
completion_window_secs = 86400

[payments]
# Public x402 facilitator for testnets. For mainnet use Coinbase CDP:
#   facilitator_url = "https://api.cdp.coinbase.com/platform/v2/x402"
#   facilitator_auth = "cdp"     # reads CDP_API_KEY_ID and CDP_API_KEY_SECRET
# Any other facilitator that takes a fixed Authorization header:
#   facilitator_auth = "static"
#   facilitator_auth_env = "FACILITATOR_AUTH"
facilitator_url = "https://x402.org/facilitator"
facilitator_auth = "none"
service_name = "Enclavo"
max_timeout_secs = 300
min_topup_micro = 1000000     # $1
max_topup_micro = 10000000000 # $10,000

# Base Sepolia USDC. `upto` pays per request; `exact` buys prepaid credit.
[[payments.networks]]
network = "eip155:84532"
asset = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
pay_to = "0x0000000000000000000000000000000000000000"   # your receiving address
asset_decimals = 6
schemes = ["upto", "exact"]
extra = { name = "USDC", version = "2" }

# Base mainnet USDC.
# [[payments.networks]]
# network = "eip155:8453"
# asset = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
# pay_to = "0x..."
# schemes = ["upto", "exact"]
# extra = { name = "USD Coin", version = "2" }

# Solana devnet USDC. Solana `upto` escrows the maximum first, then settles the charge.
# [[payments.networks]]
# network = "solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"
# asset = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
# pay_to = "<your devnet address>"
# schemes = ["upto", "exact"]
# upto_flow = "escrow"

[[providers]]
id = "near-ai"
base_url = "https://cloud-api.near.ai/v1"
api_key_env = "NEAR_AI_API_KEY"
max_concurrency = 64

[[providers]]
id = "redpill"
base_url = "https://api.redpill.ai/v1"
api_key_env = "REDPILL_API_KEY"
max_concurrency = 32          # default workspace limit is 300 requests/min

[[providers]]
id = "venice"
base_url = "https://api.venice.ai/api/v1"
api_key_env = "VENICE_API_KEY"
max_concurrency = 32

