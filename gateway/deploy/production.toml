# Enclavo gateway, production. Baked into the image at /etc/enclavo/production.toml and selected with
# ENCLAVO_CONFIG in fly.production.toml. Secrets come from `fly secrets`, never from this file.
# Check it locally with: cargo run -- --check deploy/production.toml

[server]
listen = "0.0.0.0:8080"
public_url = "https://enclavo-gateway.fly.dev"
max_body_bytes = 10485760
client_ip_header = "fly-client-ip"   # set by Fly's proxy; clients can't forge it
metrics_listen = "[::]:9091"         # scraped by Fly over the private network
drain_timeout_secs = 280             # under Fly's 300s kill_timeout

[database]
url_env = "DATABASE_URL"
max_connections = 20

[pricing]
markup_bps = 0
default_max_tokens = 4096

[router]
max_attempts = 3
first_byte_timeout_secs = 30
failure_threshold = 3
cooldown_secs = 10
max_cooldown_secs = 300

[limits]
per_key_rps = 20
per_key_burst = 40
per_ip_rps = 10
per_ip_burst = 20

[batch]
enabled = true
discount_bps = 3000
max_concurrency = 8
live_busy_threshold = 64

[payments]
# Coinbase CDP facilitator (supports `upto` on Base). Each call carries a JWT signed with the CDP
# API key in the CDP_API_KEY_ID / CDP_API_KEY_SECRET secrets.
facilitator_url = "https://api.cdp.coinbase.com/platform/v2/x402"
facilitator_auth = "cdp"
service_name = "Enclavo"
max_timeout_secs = 300
min_topup_micro = 1000000
max_topup_micro = 100000000

# Base mainnet USDC. pay_to should be a treasury address (ideally a multisig), not a hot wallet.
[[payments.networks]]
network = "eip155:8453"
asset = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
pay_to = "REPLACE_WITH_TREASURY_ADDRESS"
asset_decimals = 6
schemes = ["upto", "exact"]
extra = { name = "USD Coin", version = "2" }

[[providers]]
id = "near-ai"
base_url = "https://cloud-api.near.ai/v1"
api_key_env = "NEAR_AI_API_KEY"
max_concurrency = 64

[[providers]]
id = "redpill"
base_url = "https://api.redpill.ai/v1"
api_key_env = "REDPILL_API_KEY"
max_concurrency = 32          # default workspace limit is 300 requests/min

[[providers]]
id = "venice"
base_url = "https://api.venice.ai/api/v1"
api_key_env = "VENICE_API_KEY"
max_concurrency = 32

# Routes mirror src/lib/market.ts. Check each provider's /v1/models for exact upstream ids.
# micro_usd_per_iu is the price of 1 IU in micro-USD; tokens_per_iu converts the model to IU.

