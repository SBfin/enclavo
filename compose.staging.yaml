# Production-image rehearsal, isolated from the development database and volumes.
# docker compose -f compose.staging.yaml up --build --wait --wait-timeout 180
name: enclavo-staging-check
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: enclavo
      POSTGRES_PASSWORD: enclavo
      POSTGRES_DB: enclavo
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enclavo -d enclavo"]
      interval: 2s
      timeout: 3s
      retries: 20
  gateway:
    build:
      context: ./gateway
      target: gateway
    environment:
      ENCLAVO_CONFIG: near-ai
      ENCLAVO_LISTEN: "[::]:8080"
      ENCLAVO_DRAIN_TIMEOUT_SECS: "280"
      ENCLAVO_PUBLIC_URL: http://localhost:3002/api
      DATABASE_URL: postgres://enclavo:enclavo@postgres:5432/enclavo
      NEAR_AI_API_KEY: ${NEAR_AI_API_KEY:?Set NEAR_AI_API_KEY in .env}
      NEAR_AI_MODEL: ${NEAR_AI_MODEL:-z-ai/glm-5.3-flash}
      ENCLAVO_AUCTION_CONTRACT: ${ENCLAVO_AUCTION_CONTRACT-enclavo-auction.testnet}
      ENCLAVO_CONTROL_TOKEN: ${STAGING_CONTROL_TOKEN:?Set a separate STAGING_CONTROL_TOKEN}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 300s
  web:
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_NEAR_NETWORK: testnet
    environment:
      ENCLAVO_GATEWAY_URL: http://gateway:8080
      ENCLAVO_CONTROL_TOKEN: ${STAGING_CONTROL_TOKEN}
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 300s
volumes:
  staging_pgdata:
